name: Mobile CI

on:
  push:
    paths:
      - 'mobile/**'
      - 'contracts/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'contracts/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  flutter-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install mobile dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

  android-compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install mobile dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Compile Android Kotlin
        working-directory: mobile/android
        run: timeout 900s ./gradlew :app:compileDebugKotlin --console=plain --no-daemon --stacktrace
