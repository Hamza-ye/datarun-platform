version: 2
standing: non-authoritative manifest
purpose:
  - List the platform-spec outline sections and the local files or candidate inputs attached to them.
  - Feed local snapshot tooling without creating architecture, gap, acceptance, implementation, or remote-tracking authority.
  - Help a drafting or review session find the right files after reading the accepted baseline, gap register, responsibility map, and outline.
does_not_own:
  - architecture baseline
  - open-gap ownership or closure
  - section acceptance
  - implementation readiness
  - engineering tickets or tests
  - remote issues, projects, or sync state
authority_path:
  accepted_baseline: ../professional-baseline/04-architecture-baseline-v0.md
  canonical_gap_register: ../professional-baseline/05-decision-gap-register.md
  responsibility_map: ../professional-baseline/07-system-boundary-map.md
  platform_spec_outline: ../professional-baseline/20-platform-spec-outline.md
rule: If this manifest disagrees with the accepted baseline, gap register, responsibility map, outline, or an accepted section, treat this manifest as stale and update it after the source-authority decision.
status_values:
  - planned
  - candidate-input
  - draft
  - accepted
  - deferred
  - hold-back
  - rejected
current_focus:
  - Review draft sections 00, 01, 02, 03, 90, and 91 against 05 and 20.
  - Do not treat 03 as implementation-ready until schema/version/reference blockers are closed or explicitly held back.
  - Classify old candidate section files before reusing them in outline-aligned sections 04 through 12.
