version: "3.9"

services:
  db:
    image: ghcr.io/vadosware/pg_idkit:0.2.3-pg16.2-alpine3.18-amd64
    environment:
      POSTGRES_DB: datarun
      POSTGRES_USER: datarun
      POSTGRES_PASSWORD: datarun
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datarun"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        IMAGE_VERSION: ${DATARUN_IMAGE_VERSION:-dev}
        IMAGE_REVISION: ${DATARUN_IMAGE_REVISION:-local}
        IMAGE_CREATED: ${DATARUN_IMAGE_CREATED:-unknown}
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: datarun
      DB_USER: datarun
      DB_PASSWORD: datarun
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
