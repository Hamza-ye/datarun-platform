<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Datarun Assignments</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            background: #f7f8fa;
            color: #1f2933;
        }
        main {
            max-width: 1120px;
            margin: 0 auto;
            padding: 24px;
        }
        header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin: 0 0 4px;
        }
        h2 {
            font-size: 18px;
            margin: 0 0 12px;
        }
        section {
            background: #ffffff;
            border: 1px solid #d7dde5;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .message {
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }
        .success {
            background: #e7f7ed;
            border: 1px solid #9fd9b4;
        }
        .error {
            background: #fdeaea;
            border: 1px solid #e3a3a3;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
        }
        label {
            display: block;
            color: #52606d;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        input, textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #cbd3dd;
            border-radius: 6px;
            padding: 9px 10px;
            margin-top: 4px;
            color: #1f2933;
            background: #ffffff;
            font: inherit;
        }
        textarea {
            min-height: 76px;
            resize: vertical;
        }
        button, .link-button {
            border: 1px solid #2f6f9f;
            background: #2f6f9f;
            color: #ffffff;
            border-radius: 6px;
            padding: 8px 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        .notice {
            border: 1px solid #e2e7ee;
            border-radius: 6px;
            padding: 10px;
            background: #fbfcfd;
            color: #52606d;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid #e2e7ee;
            vertical-align: top;
            overflow-wrap: anywhere;
        }
        th {
            color: #52606d;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>Assignments</h1>
            <div>Actor <span th:text="${actorId}"></span></div>
        </div>
        <a class="link-button" href="/web-admin/shell">Admin Shell</a>
    </header>

    <div class="message success" th:if="${success}" th:text="${success}"></div>
    <div class="message error" th:if="${error}" th:text="${error}"></div>

    <section>
        <h2>Create Assignment</h2>
        <form method="post" action="/web-admin/assignments/create" th:if="${canCreate}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-grid">
                <div>
                    <label for="target_actor_id">Target Actor ID</label>
                    <input id="target_actor_id" name="target_actor_id" required>
                </div>
                <div>
                    <label for="role">Role</label>
                    <input id="role" name="role" required>
                </div>
                <div>
                    <label for="geographic_scope">Geographic Scope</label>
                    <input id="geographic_scope" name="geographic_scope">
                </div>
                <div>
                    <label for="valid_from">Valid From</label>
                    <input id="valid_from" name="valid_from" placeholder="2026-01-01T00:00:00Z">
                </div>
                <div>
                    <label for="valid_to">Valid To</label>
                    <input id="valid_to" name="valid_to" placeholder="2026-12-31T23:59:59Z">
                </div>
            </div>
            <div class="form-grid">
                <div>
                    <label for="subject_list">Subject List</label>
                    <textarea id="subject_list" name="subject_list"></textarea>
                </div>
                <div>
                    <label for="activity_list">Activity List</label>
                    <textarea id="activity_list" name="activity_list"></textarea>
                </div>
            </div>
            <div class="actions">
                <button type="submit">Create</button>
            </div>
        </form>
        <div class="notice" th:unless="${canCreate}">Create command unavailable.</div>
    </section>

    <section>
        <h2>End Assignment</h2>
        <form method="post" action="/web-admin/assignments/end" th:if="${canEnd}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-grid">
                <div>
                    <label for="assignment_id">Assignment ID</label>
                    <input id="assignment_id" name="assignment_id" required>
                </div>
                <div>
                    <label for="reason">Reason</label>
                    <input id="reason" name="reason">
                </div>
            </div>
            <div class="actions">
                <button type="submit">End</button>
            </div>
        </form>
        <div class="notice" th:unless="${canEnd}">End command unavailable.</div>
    </section>

    <section>
        <h2>Active Authority</h2>
        <table th:if="${!activeAssignments.isEmpty()}">
            <thead>
            <tr>
                <th>Assignment</th>
                <th>Role</th>
                <th>Geographic</th>
                <th>Subjects</th>
                <th>Activities</th>
                <th>Valid</th>
                <th>Commands</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="assignment : ${activeAssignments}">
                <td class="mono" th:text="${assignment.assignmentId()}"></td>
                <td th:text="${assignment.role()}"></td>
                <td>
                    <div class="mono" th:text="${assignment.geographicScope()}"></div>
                    <div th:if="${assignment.geographicPath() != null}"
                         th:text="${assignment.geographicPath()}"></div>
                </td>
                <td class="mono" th:text="${assignment.subjectList()}"></td>
                <td class="mono" th:text="${assignment.activityList()}"></td>
                <td>
                    <div th:text="${assignment.validFrom()}"></div>
                    <div th:text="${assignment.validTo()}"></div>
                </td>
                <td>
                    <span th:if="${assignment.grantsCreate()}">create</span>
                    <span th:if="${assignment.grantsCreate() and assignment.grantsEnd()}">, </span>
                    <span th:if="${assignment.grantsEnd()}">end</span>
                    <span th:unless="${assignment.grantsCreate() or assignment.grantsEnd()}">none</span>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="notice" th:if="${activeAssignments.isEmpty()}">No active assignments.</div>
    </section>
</main>
</body>
</html>
