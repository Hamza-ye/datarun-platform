<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Datarun Attention Review</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            background: #f7f8fa;
            color: #1f2933;
        }
        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px;
        }
        header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin: 0 0 4px;
        }
        h2 {
            font-size: 18px;
            margin: 0 0 12px;
        }
        section {
            background: #ffffff;
            border: 1px solid #d7dde5;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .status-item {
            border: 1px solid #e2e7ee;
            border-radius: 6px;
            padding: 10px;
            background: #fbfcfd;
        }
        .label {
            display: block;
            color: #52606d;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .value {
            font-weight: 600;
            overflow-wrap: anywhere;
        }
        .notice {
            border: 1px solid #e2e7ee;
            border-radius: 6px;
            padding: 10px;
            background: #fbfcfd;
            color: #52606d;
        }
        .blocked {
            border-color: #d7a542;
            background: #fff9e8;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .link-button,
        button {
            border: 1px solid #2f6f9f;
            background: #2f6f9f;
            color: #ffffff;
            border-radius: 6px;
            padding: 8px 12px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        .secondary {
            border-color: #52606d;
            background: #52606d;
        }
        textarea {
            width: 100%;
            min-height: 84px;
            box-sizing: border-box;
            border: 1px solid #cbd2d9;
            border-radius: 6px;
            padding: 8px;
            font: inherit;
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>Attention Review</h1>
            <div>Actor <span th:text="${actorId}"></span></div>
        </div>
        <a class="link-button" href="/web-admin/operational">Operational View</a>
    </header>

    <div class="notice" th:unless="${review.hasItem()}" th:text="${review.emptyText()}"></div>

    <div th:if="${review.hasItem()}">
        <section>
            <h2>Source Work</h2>
            <div class="status-grid">
                <div class="status-item">
                    <span class="label">Work</span>
                    <span class="value" th:text="${review.item().sourceWork().workType()}"></span>
                </div>
                <div class="status-item">
                    <span class="label">Activity</span>
                    <span class="value" th:text="${review.item().sourceWork().activity()}"></span>
                </div>
                <div class="status-item">
                    <span class="label">Subject</span>
                    <span class="value" th:text="${review.item().sourceWork().subjectId()}"></span>
                </div>
                <div class="status-item">
                    <span class="label">Received at</span>
                    <span class="value" th:text="${review.item().sourceWork().receivedAt()}"></span>
                </div>
                <div class="status-item">
                    <span class="label">Work time</span>
                    <span class="value" th:text="${review.item().sourceWork().workTime()}"></span>
                </div>
            </div>
        </section>

        <section>
            <h2>Attention</h2>
            <div class="status-grid">
                <div class="status-item">
                    <span class="label">Reason</span>
                    <span class="value" th:text="${review.item().category()}"></span>
                </div>
                <div class="status-item">
                    <span class="label">Severity</span>
                    <span class="value" th:text="${review.item().severity()}"></span>
                </div>
                <div class="status-item">
                    <span class="label">Requested at</span>
                    <span class="value" th:text="${review.item().flaggedAt()}"></span>
                </div>
            </div>
            <p th:text="${review.item().reason()}"></p>
        </section>

        <section th:classappend="${review.item().canResolve()} ? '' : ' blocked'">
            <h2>Reviewer Standing</h2>
            <p th:text="${review.item().resolverStanding()}"></p>
            <form method="post" action="/web-admin/operational/attention/resolve"
                  th:if="${review.item().canResolve()}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label for="reason">Decision note</label>
                <textarea id="reason" name="reason"></textarea>
                <div class="actions">
                    <button type="submit" name="resolution" value="accepted">Accept</button>
                    <button class="secondary" type="submit" name="resolution" value="rejected">
                        Reject
                    </button>
                </div>
            </form>
        </section>
    </div>
</main>
</body>
</html>
