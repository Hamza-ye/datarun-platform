<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Datarun Operational View</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            background: #f7f8fa;
            color: #1f2933;
        }
        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px;
        }
        header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin: 0 0 4px;
        }
        h2 {
            font-size: 18px;
            margin: 0 0 12px;
        }
        section {
            background: #ffffff;
            border: 1px solid #d7dde5;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .status-item {
            border: 1px solid #e2e7ee;
            border-radius: 6px;
            padding: 10px;
            background: #fbfcfd;
        }
        .label {
            display: block;
            color: #52606d;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .value {
            font-weight: 600;
            overflow-wrap: anywhere;
        }
        .notice {
            border: 1px solid #e2e7ee;
            border-radius: 6px;
            padding: 10px;
            background: #fbfcfd;
            color: #52606d;
        }
        .cue {
            border-color: #d7a542;
            background: #fff9e8;
        }
        .message {
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 16px;
        }
        .success {
            border: 1px solid #7bbf88;
            background: #edf8ef;
        }
        .link-button {
            border: 1px solid #2f6f9f;
            background: #2f6f9f;
            color: #ffffff;
            border-radius: 6px;
            padding: 8px 12px;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>Operational View</h1>
            <div>Signed in</div>
        </div>
        <div>
            <a class="link-button" href="/web-admin/operational/report">Scoped Operational Report Snapshot</a>
            <a class="link-button" href="/web-admin/shell">Admin Shell</a>
        </div>
    </header>

    <div class="message success" th:if="${success}" th:text="${success}"></div>

    <section>
        <h2>Latest Synced Work</h2>
        <div class="status-grid" th:if="${observation.hasLatestWork()}">
            <div class="status-item">
                <span class="label">Work</span>
                <span class="value" th:text="${observation.latestWork().workType()}"></span>
            </div>
            <div class="status-item">
                <span class="label">Activity</span>
                <span class="value" th:text="${observation.latestWork().activity()}"></span>
            </div>
            <div class="status-item">
                <span class="label">Subject</span>
                <span class="value" th:text="${observation.latestWork().subjectId()}"></span>
            </div>
            <div class="status-item">
                <span class="label">Received at</span>
                <span class="value" th:text="${observation.latestWork().receivedAt()}"></span>
            </div>
            <div class="status-item">
                <span class="label">Work time</span>
                <span class="value" th:text="${observation.latestWork().workTime()}"></span>
            </div>
        </div>
        <div class="notice" th:unless="${observation.hasLatestWork()}">
            No scoped synced work is visible yet.
        </div>
    </section>

    <section>
        <h2>Freshness</h2>
        <p th:text="${observation.freshnessText()}"></p>
    </section>

    <section class="cue" th:if="${observation.hasAttentionCue()}">
        <h2 th:text="${observation.attentionCue().label()}"></h2>
        <p th:text="${observation.attentionCue().copy()}"></p>
        <a class="link-button" th:href="${observation.attentionCue().reviewPath()}">
            Review
        </a>
    </section>
</main>
</body>
</html>
