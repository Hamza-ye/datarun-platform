<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Datarun Setup</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            background: #f7f8fa;
            color: #1f2933;
        }
        main {
            max-width: 1120px;
            margin: 0 auto;
            padding: 24px;
        }
        header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin: 0 0 4px;
        }
        h2 {
            font-size: 18px;
            margin: 0 0 12px;
        }
        section {
            background: #ffffff;
            border: 1px solid #d7dde5;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .status-item {
            border: 1px solid #e2e7ee;
            border-radius: 6px;
            padding: 10px;
            background: #fbfcfd;
        }
        .label {
            display: block;
            color: #52606d;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .value {
            font-weight: 600;
            overflow-wrap: anywhere;
        }
        .message {
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }
        .success {
            background: #e7f7ed;
            border: 1px solid #9fd9b4;
        }
        .error {
            background: #fdeaea;
            border: 1px solid #e3a3a3;
        }
        textarea {
            width: 100%;
            min-height: 420px;
            box-sizing: border-box;
            font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            border: 1px solid #cbd3dd;
            border-radius: 6px;
            padding: 12px;
            resize: vertical;
        }
        textarea[name="note"] {
            min-height: 80px;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        button, .link-button {
            border: 1px solid #2f6f9f;
            background: #2f6f9f;
            color: #ffffff;
            border-radius: 6px;
            padding: 8px 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        button.secondary {
            background: #ffffff;
            color: #2f6f9f;
        }
        ul {
            margin: 8px 0 0;
            padding-left: 18px;
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>Setup</h1>
            <div>Actor <span th:text="${actorId}"></span></div>
        </div>
        <a class="link-button" href="/web-admin/shell">Admin Shell</a>
    </header>

    <div class="message success" th:if="${success}" th:text="${success}"></div>
    <div class="message error" th:if="${error}" th:text="${error}"></div>

    <section>
        <h2>Candidate Status</h2>
        <div class="status-grid">
            <div class="status-item">
                <span class="label">Current package</span>
                <span class="value" th:text="${currentVersion}"></span>
            </div>
            <div class="status-item">
                <span class="label">Draft</span>
                <span class="value" th:text="${candidate.exists ? candidate.contentHash : 'none'}"></span>
            </div>
            <div class="status-item">
                <span class="label">Validation</span>
                <span class="value" th:text="${candidate.validationStatus}"></span>
            </div>
            <div class="status-item">
                <span class="label">Readiness</span>
                <span class="value" th:text="${candidate.readinessStatus}"></span>
            </div>
            <div class="status-item">
                <span class="label">Approval</span>
                <span class="value" th:text="${candidate.approvalHash ?: 'not approved'}"></span>
            </div>
            <div class="status-item">
                <span class="label">Published</span>
                <span class="value" th:text="${candidate.publishedConfigVersion ?: 'not published'}"></span>
            </div>
        </div>
        <div th:if="${candidate.validationViolations != null and candidate.validationViolations.size() > 0}">
            <h2>Validation Issues</h2>
            <ul>
                <li th:each="violation : ${candidate.validationViolations}"
                    th:text="${violation.asText()}"></li>
            </ul>
        </div>
    </section>

    <section>
        <h2>Draft Setup JSON</h2>
        <form method="post" action="/web-admin/config/draft" th:if="${canAuthor}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="expectedHash"
                   th:value="${candidate.contentHash ?: ''}">
            <textarea name="candidateJson" spellcheck="false"
                      th:text="${candidate.candidateJsonPretty}"></textarea>
            <div class="actions">
                <button type="submit">Save Draft</button>
            </div>
        </form>
        <textarea th:unless="${canAuthor}" readonly spellcheck="false"
                  th:text="${candidate.candidateJsonPretty}"></textarea>
    </section>

    <section>
        <h2>Workflow</h2>
        <div class="actions">
            <form method="post" action="/web-admin/config/validate" th:if="${canValidate}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="expectedHash"
                       th:value="${candidate.contentHash ?: ''}">
                <button type="submit">Validate</button>
            </form>
            <form method="post" action="/web-admin/config/readiness" th:if="${canReadinessReview}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="expectedHash"
                       th:value="${candidate.contentHash ?: ''}">
                <input type="hidden" name="readinessStatus" value="ready">
                <textarea name="note" placeholder="Readiness note"></textarea>
                <button type="submit">Mark Ready</button>
            </form>
            <form method="post" action="/web-admin/config/readiness" th:if="${canReadinessReview}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="expectedHash"
                       th:value="${candidate.contentHash ?: ''}">
                <input type="hidden" name="readinessStatus" value="rejected">
                <input type="hidden" name="note" value="Rejected in readiness review">
                <button class="secondary" type="submit">Reject</button>
            </form>
            <form method="post" action="/web-admin/config/approve" th:if="${canApprove}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="expectedHash"
                       th:value="${candidate.contentHash ?: ''}">
                <button type="submit">Approve</button>
            </form>
            <form method="post" action="/web-admin/config/publish" th:if="${canPublish}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="expectedHash"
                       th:value="${candidate.contentHash ?: ''}">
                <button type="submit">Publish</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
