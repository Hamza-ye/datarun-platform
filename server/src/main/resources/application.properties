spring.application.name=datarun-server

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:datarun}
spring.datasource.username=${DB_USER:datarun}
spring.datasource.password=${DB_PASSWORD:datarun}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Server
server.port=${SERVER_PORT:8080}

# Application-owned health and metrics. The external proxy/monitoring system
# remains responsible for access control, TLS, alerting, and host signals.
management.endpoints.enabled-by-default=false
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# Domain uniqueness calendar windows. The config package exposes only "deployment";
# this runtime property resolves the deployment timezone for server-side detection.
datarun.uniqueness.timezone=${DATARUN_UNIQUENESS_TIMEZONE:UTC}

# Authentication mode. dev-token preserves the Phase 2 actor_tokens path.
# jwt validates an HS256 JWT, then resolves (issuer, subject) through
# auth_principal_bindings. oidc-jwks validates an asymmetric provider JWT
# using issuer, audience, and JWKS URI before the same binding lookup.
# IdP groups/claims are never direct authority.
datarun.auth.mode=${DATARUN_AUTH_MODE:dev-token}
datarun.auth.jwt.issuer=${DATARUN_AUTH_JWT_ISSUER:}
datarun.auth.jwt.audience=${DATARUN_AUTH_JWT_AUDIENCE:}
datarun.auth.jwt.hmac-secret=${DATARUN_AUTH_JWT_HMAC_SECRET:}
datarun.auth.oidc.issuer=${DATARUN_AUTH_OIDC_ISSUER:}
datarun.auth.oidc.audience=${DATARUN_AUTH_OIDC_AUDIENCE:}
datarun.auth.oidc.jwks-uri=${DATARUN_AUTH_OIDC_JWKS_URI:}
datarun.auth.dev-token.allow-unauthenticated-push=${DATARUN_DEV_TOKEN_ALLOW_UNAUTHENTICATED_PUSH:true}
datarun.auth.principal-bindings.manifest=${DATARUN_AUTH_PRINCIPAL_BINDINGS_MANIFEST:}
datarun.auth.principal-bindings.applied-by=${DATARUN_AUTH_PRINCIPAL_BINDINGS_APPLIED_BY:system:auth-principal-binding-provisioner}
