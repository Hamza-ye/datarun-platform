# Production is intentionally fail-closed. ProductionRuntimeValidator checks
# these resolved values before ordinary application beans initialize.
datarun.auth.mode=${DATARUN_AUTH_MODE:}
datarun.auth.dev-token.allow-unauthenticated-push=false
datarun.auth.oidc.issuer=${DATARUN_AUTH_OIDC_ISSUER:}
datarun.auth.oidc.audience=${DATARUN_AUTH_OIDC_AUDIENCE:}
datarun.auth.oidc.jwks-uri=${DATARUN_AUTH_OIDC_JWKS_URI:}
datarun.auth.principal-bindings.applied-by=${DATARUN_AUTH_PRINCIPAL_BINDINGS_APPLIED_BY:}

spring.datasource.url=${DATARUN_DATABASE_URL:}
spring.datasource.username=${DATARUN_DATABASE_USER:}
spring.datasource.password=${DATARUN_DATABASE_PASSWORD:}

# Stop accepting new requests and allow in-flight work a bounded drain period
# before the container runtime terminates the process.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SERVER_SHUTDOWN_TIMEOUT:30s}

# Keep management traffic off the public application listener. Deployment
# assets must expose this listener only to the local monitoring boundary.
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.server.address=${MANAGEMENT_SERVER_ADDRESS:0.0.0.0}

# Logfmt-compatible structured stdout. Request logging adds only method, path,
# status, duration, request id, and resolved actor id; it never logs credentials,
# headers, query strings, request bodies, or configuration values.
logging.pattern.console=timestamp=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%p service=${spring.application.name} logger=%logger{36} thread=%thread request_id=%X{request_id:-} %kvp message="%replace(%msg){'[\r\n]+',' '}" exception="%replace(%ex{short}){'[\r\n]+',' '}"%n
